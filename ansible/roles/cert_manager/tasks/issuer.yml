---
- name: Attendre que le webhook cert-manager soit prêt
  become: false
  command: kubectl rollout status deployment/cert-manager-webhook -n cert-manager --timeout=120s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false

- name: Copier le manifest ClusterIssuer
  copy:
    src: "{{ gitops_dir }}/cert-manager/manifests/homelab-ca-issuer.yaml"
    dest: /tmp/homelab-ca-issuer.yaml

# Create-only: existing objects are kept (see helm/tasks/create_manifest.yml).
- name: Appliquer le ClusterIssuer
  include_role:
    name: helm
    tasks_from: create_manifest.yml
  vars:
    manifest_path: /tmp/homelab-ca-issuer.yaml
    manifest_component: cert-manager

---
- name: Copier le fichier de values cert-manager
  copy:
    src: "{{ gitops_dir }}/cert-manager/values.yaml"
    dest: /tmp/cert-manager-values.yaml

# Create-only: skipped when already installed (see helm/tasks/installed_components.yml).
- name: Installer cert-manager
  become: false
  command: >
    helm upgrade --install cert-manager {{ helm_charts_dir }}/cert-manager-{{ helm_charts['cert-manager'].targetRevision }}.tgz
    --namespace cert-manager
    --create-namespace
    -f /tmp/cert-manager-values.yaml
  environment:
    KUBECONFIG: /home/debian/.kube/config
  when: "'cert-manager' not in installed_components or 'cert-manager' in force_upgrade.split(',')"

- name: Attendre que cert-manager soit prêt
  become: false
  command: kubectl rollout status deployment/cert-manager -n cert-manager --timeout=120s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false

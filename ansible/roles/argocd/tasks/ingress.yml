---
- name: Copier le manifest Ingress ArgoCD
  copy:
    dest: /tmp/argocd-ingress.yaml
    content: |
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: argocd
        namespace: {{ argocd_namespace }}
        annotations:
          cert-manager.io/cluster-issuer: homelab-ca-issuer
          traefik.ingress.kubernetes.io/router.entrypoints: websecure
      spec:
        ingressClassName: traefik
        tls:
          - hosts:
              - argocd.{{ homelab_domain }}
            secretName: argocd-tls
        rules:
          - host: argocd.{{ homelab_domain }}
            http:
              paths:
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: argocd-server
                      port:
                        number: 80

# Create-only: existing objects are kept (see helm/tasks/create_manifest.yml).
- name: Appliquer l'Ingress ArgoCD
  include_role:
    name: helm
    tasks_from: create_manifest.yml
  vars:
    manifest_path: /tmp/argocd-ingress.yaml
    manifest_component: argocd

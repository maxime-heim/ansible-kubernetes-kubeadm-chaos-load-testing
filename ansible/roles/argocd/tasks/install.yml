---
- name: Installer la librairie Python kubernetes
  apt:
    name: python3-kubernetes
    state: present
    update_cache: yes

- name: Créer le namespace ArgoCD
  kubernetes.core.k8s:
    name: "{{ argocd_namespace }}"
    api_version: v1
    kind: Namespace
    state: present
  environment:
    KUBECONFIG: /home/debian/.kube/config

# Create-only: skipped when already installed (see helm/tasks/installed_components.yml).
- name: Installer ArgoCD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: "{{ helm_charts_dir }}/argo-cd-{{ helm_charts['argo-cd'].targetRevision }}.tgz"
    release_namespace: "{{ argocd_namespace }}"
    create_namespace: false
    wait: true
    timeout: 300s
    values: "{{ lookup('file', gitops_dir ~ '/argocd/values.yaml') | from_yaml }}"
  environment:
    KUBECONFIG: /home/debian/.kube/config
  when: "'argocd' not in installed_components or 'argocd' in force_upgrade.split(',')"

# Create-only: skipped when already installed (see helm/tasks/installed_components.yml).
- name: Déployer l'App of Apps
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: app-of-apps
        namespace: "{{ argocd_namespace }}"
        finalizers:
          - resources-finalizer.argocd.argoproj.io
      spec:
        project: default
        source:
          repoURL: "{{ argocd_repo_url }}"
          targetRevision: HEAD
          path: "{{ argocd_gitops_path }}"
        destination:
          server: https://kubernetes.default.svc
          namespace: "{{ argocd_namespace }}"
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
          syncOptions:
            - CreateNamespace=true
  environment:
    KUBECONFIG: /home/debian/.kube/config
  when: "'app-of-apps' not in installed_components or 'app-of-apps' in force_upgrade.split(',')"

---
# The version is the one of the manifest, vendored in gitops/: "releases/latest" could
# upgrade the component on any run. It already has the --kubelet-insecure-tls flag.
- name: Copier le manifeste metrics-server
  copy:
    src: "{{ gitops_dir }}/metrics-server/manifests/components.yaml"
    dest: /tmp/metrics-server.yaml

# Create-only: existing objects are kept (see helm/tasks/create_manifest.yml).
- name: Déployer le manifeste metrics-server
  include_role:
    name: helm
    tasks_from: create_manifest.yml
  vars:
    manifest_path: /tmp/metrics-server.yaml
    manifest_component: metrics-server

- name: Attendre que metrics-server soit prêt
  become: false
  command: kubectl rollout status deployment/metrics-server -n kube-system --timeout=120s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false

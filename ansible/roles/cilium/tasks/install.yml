---
# Create-only: skipped when already installed (see helm/tasks/installed_components.yml).
- name: Installer Cilium
  become: false
  command: >-
    helm upgrade --install cilium {{ helm_charts_dir }}/cilium-{{ helm_charts['cilium'].version }}.tgz
    --namespace kube-system
    --set ipam.mode=kubernetes
    --set routingMode=native
    --set autoDirectNodeRoutes=true
    --set ipv4NativeRoutingCIDR={{ pod_network_cidr }}
    --set hubble.enabled=true
    --set hubble.relay.enabled=true
    --set hubble.ui.enabled=true
    --set hubble.ui.service.type=ClusterIP
    --set hubble.metrics.enabled="{dns,drop,tcp,flow,icmp,http}"
    --set operator.replicas={{ [2, (groups['control_plane'] + groups['control_plane_secondary'] | default([])) | length] | min }}
    --set operator.prometheus.enabled=true
    --set prometheus.enabled=true
    --set dashboards.enabled=true
    --set policyAuditMode=true
    --set encryption.enabled=true
    --set encryption.type=wireguard 
  environment:
    KUBECONFIG: /home/debian/.kube/config
  when: "'cilium' not in installed_components or 'cilium' in force_upgrade.split(',')"

- name: Attendre que Cilium soit prêt
  become: false
  command: kubectl rollout status daemonset/cilium -n kube-system --timeout=120s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false

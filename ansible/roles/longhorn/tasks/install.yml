---
- name: Copier le fichier de values Longhorn
  copy:
    src: "{{ gitops_dir }}/longhorn/values.yaml"
    dest: /tmp/longhorn-values.yaml

# Create-only: skipped when already installed (see helm/tasks/installed_components.yml).
- name: Installer Longhorn
  become: false
  command: >
    helm upgrade --install longhorn {{ helm_charts_dir }}/longhorn-{{ helm_charts['longhorn'].targetRevision }}.tgz
    --namespace longhorn-system
    --create-namespace
    --wait
    -f /tmp/longhorn-values.yaml
  environment:
    KUBECONFIG: /home/debian/.kube/config
  when: "'longhorn' not in installed_components or 'longhorn' in force_upgrade.split(',')"

- name: Attendre que Longhorn soit prêt
  become: false
  command: kubectl rollout status daemonset/longhorn-manager -n longhorn-system --timeout=300s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false

# The CSI components are created by longhorn-driver-deployer, outside the chart:
# "helm --wait" does not see them. Their image pulls saturate the uplink, and the
# next roles then fail on DNS timeouts.
- name: Wait for the Longhorn CSI components to be created
  become: false
  command: kubectl wait --for=create {{ item }} -n longhorn-system --timeout=300s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  loop: "{{ longhorn_csi_components }}"
  changed_when: false

- name: Wait for the Longhorn CSI components to be ready
  become: false
  command: kubectl rollout status {{ item }} -n longhorn-system --timeout=600s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  loop: "{{ longhorn_csi_components }}"
  changed_when: false

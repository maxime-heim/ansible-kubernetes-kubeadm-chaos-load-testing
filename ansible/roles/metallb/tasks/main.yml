---
# Create-only: skipped when already installed (see helm/tasks/installed_components.yml).
- name: Installer MetalLB
  become: false
  command: >
    helm upgrade --install metallb {{ helm_charts_dir }}/metallb-{{ helm_charts['metallb'].version }}.tgz
    --namespace metallb-system
    --create-namespace
    --wait
  environment:
    KUBECONFIG: /home/debian/.kube/config
  when: "'metallb' not in installed_components or 'metallb' in force_upgrade.split(',')"

- name: Copier la configuration MetalLB
  copy:
    dest: /tmp/metallb-config.yaml
    content: |
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: homelab-pool
        namespace: metallb-system
      spec:
        addresses:
          - {{ metallb_ip_range }}
      ---
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: homelab-l2
        namespace: metallb-system
      spec:
        ipAddressPools:
          - homelab-pool

# Create-only: existing objects are kept (see helm/tasks/create_manifest.yml).
- name: Appliquer la configuration MetalLB
  include_role:
    name: helm
    tasks_from: create_manifest.yml
  vars:
    manifest_path: /tmp/metallb-config.yaml
    manifest_component: metallb

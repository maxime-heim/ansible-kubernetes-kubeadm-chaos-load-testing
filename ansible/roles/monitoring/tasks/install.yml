---
- name: Créer le namespace monitoring
  kubernetes.core.k8s:
    name: "monitoring"
    api_version: v1
    kind: Namespace
    state: present
  environment:
    KUBECONFIG: /home/debian/.kube/config

- name: Copier le fichier de values Prometheus & Grafana
  copy:
    src: "{{ gitops_dir }}/kube-prometheus-stack/values.yaml"
    dest: /tmp/kube-prometheus-stack-values.yaml

# Create-only: skipped when already installed (see helm/tasks/installed_components.yml).
- name: Installer Prometheus & Grafana
  become: false
  command: helm upgrade --install kube-prometheus-stack {{ helm_charts_dir }}/kube-prometheus-stack-{{ helm_charts['kube-prometheus-stack'].targetRevision }}.tgz --namespace monitoring -f /tmp/kube-prometheus-stack-values.yaml
  environment:
    KUBECONFIG: /home/debian/.kube/config
  when: "'kube-prometheus-stack' not in installed_components or 'kube-prometheus-stack' in force_upgrade.split(',')"

- name: Attendre que Prometheus soit prêt
  become: false
  command: kubectl rollout status deployment/kube-prometheus-stack-grafana -n monitoring --timeout=300s
  environment:
    KUBECONFIG: /home/debian/.kube/config
  changed_when: false

---
- name: Copier le manifest Ingress Grafana
  copy:
    src: "{{ gitops_dir }}/kube-prometheus-stack/manifests/ingress.yaml"
    dest: /tmp/grafana-ingress.yaml

# Create-only: existing objects are kept (see helm/tasks/create_manifest.yml).
- name: Appliquer l'Ingress Grafana
  include_role:
    name: helm
    tasks_from: create_manifest.yml
  vars:
    manifest_path: /tmp/grafana-ingress.yaml
    manifest_component: kube-prometheus-stack

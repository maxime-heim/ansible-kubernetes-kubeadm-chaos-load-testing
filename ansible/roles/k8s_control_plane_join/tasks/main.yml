---
# The condition is needed in addition to "creates": without a node to join, the join
# command is not generated, and its variable is undefined.
- name: Join the cluster as a control plane
  command: >
    {{ hostvars[groups['control_plane'][0]]['kubeadm_join_command'] }}
    --control-plane
    --certificate-key {{ hostvars[groups['control_plane'][0]]['kubeadm_certificate_key'] }}
    --apiserver-advertise-address={{ ansible_host }}
  args:
    creates: /etc/kubernetes/admin.conf
  when: needs_join

- name: Deploy kube-vip
  include_role:
    name: kube_vip

- name: Set up the kubeconfig of the debian user
  include_role:
    name: k8s_control_plane
    tasks_from: kubeconfig.yml

- name: Wait for the local API server
  uri:
    url: "https://{{ ansible_host }}:6443/readyz"
    validate_certs: false
  register: api_ready
  until: api_ready.status == 200
  retries: 30
  delay: 5

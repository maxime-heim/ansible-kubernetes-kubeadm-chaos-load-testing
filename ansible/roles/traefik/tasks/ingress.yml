---
- name: Copier les manifests dashboard Traefik
  copy:
    src: "{{ gitops_dir }}/traefik/manifests/dashboard.yaml"
    dest: /tmp/traefik-dashboard.yaml

# Create-only: existing objects are kept (see helm/tasks/create_manifest.yml).
- name: Appliquer les manifests dashboard Traefik
  include_role:
    name: helm
    tasks_from: create_manifest.yml
  vars:
    manifest_path: /tmp/traefik-dashboard.yaml
    manifest_component: traefik

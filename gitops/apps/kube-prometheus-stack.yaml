# Adopted from the Ansible install: same chart, version, release name and values.
# Manual sync, without prune nor finalizer: removing this file leaves the component
# running. Enable "automated" only once the diff is empty or explained.
#
# Argo CD renders the chart without access to the cluster, so the chart cannot find the
# existing password and generates one on each render. The one in place is kept.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  sources:
    # Also read by Ansible for the bootstrap (ansible/group_vars/all.yml): keep it first.
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "93.11.0"
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/gitops/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/maxime-heim/ansible-kubernetes-kubeadm-chaos-load-testing
      targetRevision: HEAD
      ref: values
      path: gitops/kube-prometheus-stack/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  ignoreDifferences:
    - kind: Secret
      name: kube-prometheus-stack-grafana
      namespace: monitoring
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: kube-prometheus-stack-grafana
      namespace: monitoring
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true

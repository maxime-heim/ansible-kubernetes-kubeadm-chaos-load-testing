apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homelab-ca-issuer
  annotations:
    # The CRD comes from the chart of the same Application.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
spec:
  ca:
    # Created by Ansible: it holds the private key of the CA, which must not be in Git.
    secretName: homelab-ca
